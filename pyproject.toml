[project]
name = "agentic-ai-hackathon"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Shohei Fujieda", email = "96054771+ShoheiFujieda@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.11.0",
    "google-cloud-firestore>=2.34.0",
    "pypdf>=6.19.0",
]

[project.scripts]
agentic-ai-hackathon = "agentic_ai_hackathon:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 行の長さは ruff format に任せる（日本語の文字列は折り返せないため）
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# ADK はパッケージの __init__.py で `from . import agent` と書く決まり
"**/__init__.py" = ["F401"]
