<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="'Noto Sans JP','Yu Gothic UI','Hiragino Sans',Meiryo,sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#49454F"/></marker>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C77700"/></marker>
</defs>
<rect width="1600" height="960" fill="#FEF7FF"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#1D1B20">奨学金エージェント ― 全体像（図1/3）</text>
<text x="40" y="84" font-size="16" fill="#49454F">誰が使い、どこで動き、何とつながるか。左から右へ「入力 → 処理 → 外部」。中身の詳しい流れは図2、安全装置は図3</text>
<rect x="40" y="150" width="250" height="230" rx="12" fill="#FFE8CC" stroke="#C77700" stroke-width="2"/>
<text x="54" y="178" font-size="16" font-weight="700" fill="#4A2800">ユーザー（ブラウザ）</text>
<text x="54" y="205.5" font-size="13.5" fill="#4A2800" fill-opacity="0.82">・立場・地域・目的を入れる</text>
<text x="54" y="225.0" font-size="13.5" fill="#4A2800" fill-opacity="0.82">・結果の表を見る</text>
<text x="54" y="244.5" font-size="13.5" fill="#4A2800" fill-opacity="0.82">・保存リストと CSV</text>
<text x="54" y="264.0" font-size="13.5" fill="#4A2800" fill-opacity="0.82">・許可ダイアログで承認</text>
<text x="54" y="283.5" font-size="13.5" fill="#4A2800" fill-opacity="0.82">・操作の記録を見る</text>
<line x1="290" y1="265" x2="350" y2="265" stroke="#49454F" stroke-width="2.5" marker-end="url(#a)"/>
<text x="320" y="252" font-size="12.5" text-anchor="middle" fill="#49454F">HTTPS</text>
<rect x="350" y="120" width="880" height="700" rx="16" fill="#FFFFFF" fill-opacity="0.6" stroke="#6750A4" stroke-width="2"/>
<image href="data:image/svg+xml;base64," x="362" y="126" width="34" height="34"/>
<text x="404" y="148" font-size="17" font-weight="700" fill="#1D1B20">Google Cloud Run：hackathon-agent（最大1インスタンス・専用サービスアカウント）</text>
<rect x="374" y="165" width="832" height="100" rx="12" fill="#EADDFF" stroke="#6750A4" stroke-width="2"/>
<text x="388" y="193" font-size="16" font-weight="700" fill="#21005D">① 入口（Basic 認証）</text>
<text x="388" y="220.5" font-size="13.5" fill="#21005D" fill-opacity="0.82">パスワードは Secret Manager。未設定なら全アクセスを拒否。</text>
<text x="388" y="240.0" font-size="13.5" fill="#21005D" fill-opacity="0.82">利用者向けサイト（/）、許可・保存 API（/admin/）、エージェント API（/run_sse）</text>
<line x1="790" y1="265" x2="790" y2="295" stroke="#49454F" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="374" y="295" width="832" height="120" rx="12" fill="#D3E3FD" stroke="#1A73E8" stroke-width="2"/>
<text x="388" y="323" font-size="16" font-weight="700" fill="#041E49">② ADK エージェント（1つだけ）</text>
<text x="388" y="350.5" font-size="13.5" fill="#041E49" fill-opacity="0.82">Gemini 3.8 Flash が、条件の聞き取り・ツールの呼び出し・結果の短い要約を担当。</text>
<text x="388" y="370.0" font-size="13.5" fill="#041E49" fill-opacity="0.82">探し方・判定・安全のルールは持たない（③④のコードが持つ）。</text>
<rect x="1154" y="305" width="42" height="22" rx="11" fill="#1A73E8"/>
<text x="1175.0" y="321" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">AI</text>
<line x1="790" y1="415" x2="790" y2="445" stroke="#49454F" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="374" y="445" width="832" height="130" rx="12" fill="#EADDFF" stroke="#6750A4" stroke-width="2"/>
<text x="388" y="473" font-size="16" font-weight="700" fill="#21005D">③ 安全装置（ツールの実行の直前と直後に必ず通る）</text>
<text x="388" y="500.5" font-size="13.5" fill="#21005D" fill-opacity="0.82">before：許可リスト／引数の検証／検索回数の上限／高リスクは承認待ちで停止</text>
<text x="388" y="520.0" font-size="13.5" fill="#21005D" fill-opacity="0.82">after：誰が・いつ・何を・なぜ・結果を、監査ログに記録</text>
<text x="388" y="539.5" font-size="13.5" fill="#21005D" fill-opacity="0.82">エラー時：安全な文面にフォールバック。Web ページの文章は命令として扱わない</text>
<rect x="1140" y="455" width="56" height="22" rx="11" fill="#6750A4"/>
<text x="1168.0" y="471" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">コード</text>
<line x1="790" y1="575" x2="790" y2="605" stroke="#49454F" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="374" y="605" width="270" height="190" rx="12" fill="#EADDFF" stroke="#6750A4" stroke-width="2"/>
<text x="388" y="633" font-size="16" font-weight="700" fill="#21005D">find_scholarships</text>
<text x="388" y="660.5" font-size="13.5" fill="#21005D" fill-opacity="0.82">探して、判定する</text>
<text x="388" y="680.0" font-size="13.5" fill="#21005D" fill-opacity="0.82">（詳しくは図2）</text>
<text x="388" y="699.5" font-size="13.5" fill="#21005D" fill-opacity="0.82">低リスク：自動で実行</text>
<rect x="664" y="605" width="270" height="190" rx="12" fill="#EADDFF" stroke="#6750A4" stroke-width="2"/>
<text x="678" y="633" font-size="16" font-weight="700" fill="#21005D">get_scholarship_detail</text>
<text x="678" y="660.5" font-size="13.5" fill="#21005D" fill-opacity="0.82">筑波大学の一覧の</text>
<text x="678" y="680.0" font-size="13.5" fill="#21005D" fill-opacity="0.82">項目の詳細</text>
<text x="678" y="699.5" font-size="13.5" fill="#21005D" fill-opacity="0.82">低リスク：自動で実行</text>
<rect x="954" y="605" width="252" height="190" rx="12" fill="#FFE8CC" stroke="#C77700" stroke-width="2"/>
<text x="968" y="633" font-size="16" font-weight="700" fill="#4A2800">register_shared_scholarship</text>
<text x="968" y="660" font-size="13" fill="#4A2800" fill-opacity="0.82">他の人にも見える</text>
<text x="968" y="679" font-size="13" fill="#4A2800" fill-opacity="0.82">共有リストへ追加</text>
<text x="968" y="698" font-size="13" fill="#4A2800" fill-opacity="0.82">高リスク：本人の承認が必須（図3）</text>
<rect x="1290" y="130" width="270" height="130" rx="12" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
<text x="1304" y="158" font-size="16" font-weight="700" fill="#1D1B20">Vertex AI</text>
<text x="1304" y="185" font-size="13" fill="#1D1B20" fill-opacity="0.82">Gemini 3.8 Flash</text>
<text x="1304" y="204" font-size="13" fill="#1D1B20" fill-opacity="0.82">Google 検索グラウンディング</text>
<text x="1304" y="223" font-size="13" fill="#1D1B20" fill-opacity="0.82">（候補の発見・公式ページの探索）</text>
<image href="data:image/svg+xml;base64," x="1502" y="140" width="44" height="44"/>
<rect x="1290" y="290" width="270" height="200" rx="12" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
<text x="1304" y="318" font-size="16" font-weight="700" fill="#1D1B20">Firestore</text>
<text x="1304" y="344.5" font-size="12.5" fill="#1D1B20" fill-opacity="0.82">audit_logs　監査ログ</text>
<text x="1304" y="363.0" font-size="12.5" fill="#1D1B20" fill-opacity="0.82">approvals　承認待ちと許可</text>
<text x="1304" y="381.5" font-size="12.5" fill="#1D1B20" fill-opacity="0.82">scholarship_cache　確認済みの条件</text>
<text x="1304" y="400.0" font-size="12.5" fill="#1D1B20" fill-opacity="0.82">saved_scholarships　保存リスト</text>
<text x="1304" y="418.5" font-size="12.5" fill="#1D1B20" fill-opacity="0.82">shared_scholarships　共有リスト</text>
<rect x="1290" y="520" width="270" height="100" rx="12" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
<text x="1304" y="548" font-size="16" font-weight="700" fill="#1D1B20">Secret Manager</text>
<text x="1304" y="575" font-size="13" fill="#1D1B20" fill-opacity="0.82">ログインのパスワード</text>
<text x="1304" y="594" font-size="13" fill="#1D1B20" fill-opacity="0.82">（環境変数として注入）</text>
<rect x="1290" y="650" width="270" height="140" rx="12" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
<text x="1304" y="678" font-size="16" font-weight="700" fill="#1D1B20">インターネット</text>
<text x="1304" y="704.5" font-size="12.5" fill="#1D1B20" fill-opacity="0.82">各団体の公式ページ・募集要項 PDF</text>
<text x="1304" y="723.0" font-size="12.5" fill="#1D1B20" fill-opacity="0.82">robots.txt を守る・http(s) のみ</text>
<text x="1304" y="741.5" font-size="12.5" fill="#1D1B20" fill-opacity="0.82">内部アドレスは取得しない</text>
<line x1="1230" y1="215" x2="1290" y2="195" stroke="#49454F" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1230" y1="370" x2="1290" y2="390" stroke="#49454F" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1230" y1="570" x2="1290" y2="570" stroke="#49454F" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1230" y1="720" x2="1290" y2="720" stroke="#49454F" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="40" y="440" width="250" height="200" rx="12" fill="#FFE8CC" stroke="#C77700" stroke-width="2"/>
<text x="54" y="468" font-size="16" font-weight="700" fill="#4A2800">人間の承認は別の経路</text>
<text x="54" y="495" font-size="13" fill="#4A2800" fill-opacity="0.82">AI は承認の操作を持たない。</text>
<text x="54" y="514" font-size="13" fill="#4A2800" fill-opacity="0.82">高リスクの操作は止まり、</text>
<text x="54" y="533" font-size="13" fill="#4A2800" fill-opacity="0.82">本人がダイアログで許可した</text>
<text x="54" y="552" font-size="13" fill="#4A2800" fill-opacity="0.82">ときだけ、その1回が通る。</text>
<text x="54" y="571" font-size="13" fill="#4A2800" fill-opacity="0.82">（詳しくは図3）</text>
<line x1="165" y1="380" x2="165" y2="440" stroke="#C77700" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#h)"/>
<text x="190" y="415" font-size="12.5" text-anchor="middle" fill="#C77700">許可</text>
<rect x="40" y="850" width="1520" height="70" rx="12" fill="#F4EFF4" stroke="#CAC4D0" stroke-width="2"/>
<text x="54" y="878" font-size="16" font-weight="700" fill="#79747E">運用上の設計（非機能）</text>
<text x="54" y="905" font-size="13" fill="#79747E" fill-opacity="0.82">費用：検索は1会話3回まで・LLM 呼び出しは1回20回まで・最大1インスタンス・確認済みの条件を共有キャッシュ　／　権限：専用サービスアカウントに Firestore・Vertex AI・秘密1つの閲覧だけ</text>
<text x="40" y="940" font-size="14" font-weight="700" text-anchor="start" fill="#1D1B20">凡例</text>
<rect x="90" y="926" width="22" height="16" rx="4" fill="#EADDFF" stroke="#6750A4" stroke-width="2"/>
<text x="120" y="940" font-size="13" font-weight="400" text-anchor="start" fill="#49454F">コード（自作）</text>
<rect x="280" y="926" width="22" height="16" rx="4" fill="#D3E3FD" stroke="#1A73E8" stroke-width="2"/>
<text x="310" y="940" font-size="13" font-weight="400" text-anchor="start" fill="#49454F">AI（Gemini）</text>
<rect x="470" y="926" width="22" height="16" rx="4" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
<text x="500" y="940" font-size="13" font-weight="400" text-anchor="start" fill="#49454F">Google Cloud・外部</text>
<rect x="660" y="926" width="22" height="16" rx="4" fill="#FFE8CC" stroke="#C77700" stroke-width="2"/>
<text x="690" y="940" font-size="13" font-weight="400" text-anchor="start" fill="#49454F">人（本人）</text>
<line x1="850" y1="934" x2="886" y2="934" stroke="#49454F" stroke-width="2.5" marker-end="url(#a)"/>
<text x="894" y="940" font-size="13" font-weight="400" text-anchor="start" fill="#49454F">呼び出し・データ</text>
<line x1="1020" y1="934" x2="1056" y2="934" stroke="#C77700" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#h)"/>
<text x="1064" y="940" font-size="13" font-weight="400" text-anchor="start" fill="#49454F">人間の承認（別の経路）</text>
</svg>